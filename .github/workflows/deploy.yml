name: Deploy a Arsys

# Cada push a main compila el SCSS y sube el sitio por FTP.
# workflow_dispatch permite lanzarlo a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita que dos deploys corran a la vez y se pisen en el servidor.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Recompila dist/css/main.css desde el SCSS. Así lo que se publica
      # siempre corresponde al código fuente, aunque olvides compilar en local.
      - name: Compilar CSS
        run: npm run build

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          # FTP plano, no FTPS. Comprobado contra el servidor: su respuesta a
          # FEAT no incluye AUTH TLS y el puerto 990 está cerrado, así que este
          # plan de Arsys no soporta FTPS de ninguna forma. Pedir ftps deja la
          # negociación TLS colgada -> "Timeout (control socket)".
          #
          # AVISO: FTP plano manda usuario y contraseña sin cifrar. Es aceptable
          # solo porque este usuario es exclusivo del deploy y su alcance está
          # limitado a la raíz web. NO metas aquí credenciales de tu cuenta.
          #
          # Mejor opción disponible: el puerto 22 responde OpenSSH 8.0, o sea
          # que hay SFTP. Requiere que Arsys tenga el acceso SSH habilitado
          # para tu usuario (se pide/activa desde el panel). Al migrar, esta
          # acción no sirve: SamKirkland/FTP-Deploy-Action no habla SFTP.
          protocol: ftp
          local-dir: ./
          # Raíz web verificada por FTP: el usuario aterriza en la raíz de la
          # cuenta, que contiene cgi-bin/, data/, errors/, html/, logs/ y tmp/.
          # El index.html vive en html/, y esa raíz no es escribible: por eso
          # server-dir: / daba "550 Failed to change directory".
          server-dir: /html/
          # Sincronización incremental: la acción guarda un state file en el
          # servidor y en los siguientes deploys solo sube lo que ha cambiado.
          # El .htaccess bloquea los .json, así que no queda expuesto.
          # Tiene que ser un string multilínea (bloque "|"), no una lista YAML:
          # los inputs de with: en Actions solo admiten valores escalares.
          # OJO: se excluye src/scss, NO src/js. El navegador carga
          # src/js/main.js como ES Module desde index.html.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/node_modules/**
            package.json
            package-lock.json
            src/scss/**
            **/*.map
            README.md
            CNAME
            .gitattributes

      # Comprobación automática tras el deploy.
      # Solo falla si el sitio se ha roto de verdad; lo demás son avisos,
      # porque depende de módulos de Apache que quizá Arsys no tenga activos.
      - name: Verificar el sitio publicado
        run: |
          FALLOS=0
          AVISOS=0

          echo "→ La home debe responder 200"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 20 https://flotul.es/)
          echo "   https://flotul.es/ -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "   ERROR: el sitio no responde correctamente."
            FALLOS=$((FALLOS+1))
          fi

          echo "→ robots.txt y sitemap.xml deben ser accesibles"
          for f in robots.txt sitemap.xml; do
            C=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "https://flotul.es/$f")
            echo "   /$f -> $C"
            if [ "$C" != "200" ]; then
              echo "   ERROR: /$f no accesible. Google no podrá rastrear el sitemap."
              FALLOS=$((FALLOS+1))
            fi
          done

          echo "→ www debería redirigir con 301 (mod_rewrite + .htaccess)"
          W=$(curl -s -o /dev/null -w '%{http_code}' -m 20 https://www.flotul.es/)
          echo "   https://www.flotul.es/ -> $W"
          if [ "$W" != "301" ]; then
            echo "   AVISO: se esperaba 301. Comprueba que .htaccess ha subido"
            echo "          (los clientes FTP suelen ocultar los archivos con punto)."
            AVISOS=$((AVISOS+1))
          fi

          echo "→ el HTML debería servirse comprimido (mod_deflate)"
          ENC=$(curl -s -m 20 --compressed -o /dev/null -D - https://flotul.es/ \
                | tr -d '\r' | grep -i '^content-encoding:' || true)
          echo "   ${ENC:-sin cabecera Content-Encoding}"
          if [ -z "$ENC" ]; then
            echo "   AVISO: sin compresión. Pide a Arsys que active mod_deflate."
            AVISOS=$((AVISOS+1))
          fi

          echo "----------------------------------------"
          echo "Errores: $FALLOS · Avisos: $AVISOS"
          [ "$FALLOS" -eq 0 ] || exit 1
